name: Build Repo Index

on:
  push:
    branches: [ main, master ]
    paths:
      - 'debs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev bzip2

      - name: Generate index
        run: |
          chmod +x scripts/make-repo.sh
          sh scripts/make-repo.sh

      - name: Show Packages
        run: |
          echo "=== Release ===" ; cat Release
          echo "=== Packages ===" ; head -60 Packages || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
          exclude_assets: '.github,scripts,README.md,.gitignore'
